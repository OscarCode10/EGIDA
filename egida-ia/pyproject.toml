[project]
name = "egida-ia"
version = "0.1.0"
description = "Módulo de IA de ÉGIDA: Prioridad IA y probabilidad de falso positivo de hallazgos DAST"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
